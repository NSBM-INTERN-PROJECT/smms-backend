# ─────────────────────────────────────────────────────────────
# SMMS Backend — config-server-build-check
# ─────────────────────────────────────────────────────────────
name: config-server-build-check-pipeline

on:
  push:
    branches:
      - "service/config-server"
    paths:
      - "services/config-server/**"
      - "pom.xml"

  pull_request:
    branches:
      - "dev"
      - "main"
    paths:
      - "services/config-server/**"
      - "pom.xml"
jobs:

  build:

    name: Maven Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give Permissions to Maven in ubuntu
        run: chmod +x mvnw

      #      to see what files are in the project folder
      - name: see files
        run: ls -la

      - name: Build & Test config-server
        run: ./mvnw clean test -f services/config-server -am

      - name: Package config-server
        run: ./mvnw package -DskipTests -f services/config-server -am

      - name: Upload config-server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-server-jar
          path: services/config-server/target/*.jar

      - name: Report build status
        if: always()
        run: echo "Build completed with status ${{ job.status }}"

