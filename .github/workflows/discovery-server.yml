# ─────────────────────────────────────────────────────────────
# SMMS Backend — discovery-server-build-check
# ─────────────────────────────────────────────────────────────
name: discovery-server-build-check-pipeline

on:
  push:
    branches:
      - "service/discovery-server"
    paths:
      - "services/discovery-server/**"
      - "pom.xml"

  pull_request:
    branches:
      - "dev"
    paths:
      - "services/discovery-server/**"
      - "pom.xml"
jobs:

  build:

    name: Maven Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      #to see what files are in the project folder
      - name: see files
        run: ls -la

      - name: Build discovery-server (skip tests for speed)
        run: mvn clean install -pl discovery-server -am -DskipTests --no-transfer-progress

      - name: Run unit tests
        run: mvn test -pl discovery-server --no-transfer-progress
        continue-on-error: true   # Don't fail build if tests fail during early development

      - name: Report build status
        if: always()
        run: echo "Build completed with status ${{ job.status }}"

