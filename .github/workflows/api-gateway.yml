# ─────────────────────────────────────────────────────────────
# SMMS Backend — api-gateway-build-check
# ─────────────────────────────────────────────────────────────
name: api-gateway-build-check-pipeline

on:
  push:
    branches:
      - "service/api-gateway"
    paths:
      - "services/api-gateway/**"
      - "pom.xml"

  pull_request:
    branches:
      - "dev"
      - "main"
    paths:
      - "services/api-gateway/**"
      - "pom.xml"

jobs:

  build:

    name: Maven Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give Permissions to Maven in ubuntu
        run: chmod +x mvnw

      #      to see what files are in the project folder
      - name: see files
        run: ls -la

      - name: Build & Test Application Service
        run: ./mvnw clean test -pl services/api-gateway -am

      - name: Package Application Service
        run: ./mvnw package -DskipTests -pl services/api-gateway -am

      - name: Upload Application Service Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: services/api-gateway/target/*.jar

      - name: Report build status
        if: always()
        run: echo "Build completed with status ${{ job.status }}"

