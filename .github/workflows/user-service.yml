# ─────────────────────────────────────────────────────────────
# SMMS Backend — user-service-build-check
# ─────────────────────────────────────────────────────────────
name: user-service-build-check-pipeline

on:
  push:
    branches:
      - "service/user-service"
    paths:
      - "services/user-service/**"
      - "pom.xml"

  pull_request:
    branches:
      - "dev"
      - "main"
    paths:
      - "services/user-service/**"
      - "pom.xml"
jobs:

  build:

    name: Maven Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give Permissions to Maven in ubuntu
        run: chmod +x mvnw

      #      to see what files are in the project folder
      - name: see files
        run: ls -la

      - name: Build & Test user-service
        run: ./mvnw clean test -f services/user-service -am

      - name: Package user-service
        run: ./mvnw package -DskipTests -f services/user-service -am

      - name: Upload user-service Artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          path: services/user-service/target/*.jar

      - name: Report build status
        if: always()
        run: echo "Build completed with status ${{ job.status }}"

